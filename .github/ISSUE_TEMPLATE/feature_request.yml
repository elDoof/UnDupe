name: Feature request
description: Suggest something UnDupe should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem you're hitting, rather than the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like UnDupe to do about it?
    validations:
      required: true
